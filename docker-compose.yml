services:
  node-1:
    build: .
    environment:
      NODE_ID: node-1
      STORAGE_BACKEND: sqlite
      DB_PATH: data/node-1.db
      CLUSTER_NODES: node-1,node-2,node-3
      PORT: "8000"
      INTERNAL_PORT: "8443"
      METRICS_PORT: "9090"
      # Externally-reachable (host-mapped) URLs -- identical on every node,
      # since the browser-served dashboard needs the full roster regardless
      # of which node happens to be serving its bundle. Docker DNS names
      # (node-1 etc.) don't resolve from a browser at all; only these
      # host-published ports do.
      PUBLIC_CLUSTER_URLS: "https://localhost:8001,https://localhost:8002,https://localhost:8003"
      TLS_CA_CERT: /app/certs/ca.crt
      TLS_NODE_CERT: /app/certs/node/node-1.crt
      TLS_NODE_KEY: /app/certs/node/node-1.key
      AUTH_TOKENS_FILE: /app/auth_tokens.json
    ports:
      - "8001:8000"
    volumes:
      - node1-data:/app/data
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/node-1:/app/certs/node:ro
      - ./auth_tokens.json:/app/auth_tokens.json:ro

  node-2:
    build: .
    environment:
      NODE_ID: node-2
